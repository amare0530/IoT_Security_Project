<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="800" y="50" font-size="34" font-weight="700" fill="#111827" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">MQTT-Based HMAC Challenge-Response Flow</text>
<text x="800" y="84" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A public UID is not enough; the server accepts only a fresh HMAC tag computed with the PUF-derived key.</text>

<rect x="110" y="125" width="280" height="58" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="250" y="161" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">IoT Device</text>
<line x1="250" y1="183" x2="250" y2="820" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8"/>

<rect x="660" y="125" width="280" height="58" rx="12" fill="#64748b" stroke="#64748b" stroke-width="2"/>
<text x="800" y="161" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">MQTT Broker</text>
<line x1="800" y1="183" x2="800" y2="820" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8"/>

<rect x="1210" y="125" width="280" height="58" rx="12" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>
<text x="1350" y="161" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Authentication Server</text>
<line x1="1350" y1="183" x2="1350" y2="820" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8"/>

<rect x="1185" y="215" width="330" height="90" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="1350" y="245" font-size="16" font-weight="500" fill="#14532d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Generate nonce</text>
<text x="1350" y="265" font-size="16" font-weight="500" fill="#14532d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Record timestamp</text>
<text x="1350" y="285" font-size="16" font-weight="500" fill="#14532d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Store pending challenge</text>
<line x1="1350" y1="305" x2="1350" y2="345" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>

<line x1="1350" y1="350" x2="805" y2="350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1075" y="328" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Publish challenge topic</text>
<text x="1075" y="350" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">{ UID, nonce, timestamp }</text>

<line x1="795" y1="385" x2="255" y2="385" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="525" y="365" font-size="15" font-weight="500" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Forward challenge</text>

<rect x="80" y="430" width="340" height="190" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="250" y="460" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Device-side processing</text>
<text x="250" y="495" font-size="16" font-weight="400" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1. Check target UID</text>
<text x="250" y="516" font-size="16" font-weight="400" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2. FE Rep(): reconstruct K</text>
<text x="250" y="537" font-size="16" font-weight="400" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3. Compute HMAC-SHA256</text>
<text x="250" y="558" font-size="16" font-weight="400" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4. Return 64-hex tag</text>

<line x1="255" y1="650" x2="795" y2="650" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="525" y="628" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Publish response topic</text>
<text x="525" y="650" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">{ UID, nonce, timestamp, HMAC tag }</text>

<line x1="805" y1="685" x2="1345" y2="685" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1075" y="665" font-size="15" font-weight="500" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Forward response</text>

<rect x="1165" y="720" width="370" height="120" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="1350" y="750" font-size="18" font-weight="700" fill="#14532d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Server verification</text>
<text x="1350" y="783" font-size="15" font-weight="400" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">UID registry + pending challenge</text>
<text x="1350" y="803" font-size="15" font-weight="400" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">timestamp window + nonce cache</text>
<text x="1350" y="823" font-size="15" font-weight="400" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">constant-time HMAC comparison</text>

<rect x="685" y="805" width="230" height="54" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="800" y="839" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Accept</text>
<rect x="940" y="805" width="230" height="54" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1055" y="839" font-size="20" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Reject</text>
<path d="M1165 805 C1080 825, 1000 830, 915 832" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
<path d="M1165 832 C1120 870, 1095 875, 1055 860" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>
</svg>